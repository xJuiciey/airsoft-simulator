name: Validate game build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and syntax-check game script
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline game script found")
          Path("/tmp/game.js").write_text(inline[-1])
          PY
          node --check /tmp/game.js
      - name: Verify PEI GIS integrations are present
        run: |
          grep -q "Building_Footprints_2026/MapServer/3/query" index.html
          grep -q "road_centerline/FeatureServer/0/query" index.html
          grep -q "function peiLoadOfficialBuildings" index.html
      - name: Verify PEI GIS endpoints and browser CORS
        run: |
          BUILDINGS="https://gis.princeedwardisland.ca/server/rest/services/GeoLincData/Building_Footprints_2026/MapServer/3/query"
          ROADS="https://gis.princeedwardisland.ca/server/rest/services/road_centerline/FeatureServer/0/query"
          curl -fsS -D /tmp/building-headers -o /tmp/buildings.json -G "$BUILDINGS" \
            --data-urlencode "where=1=1" \
            --data-urlencode "geometry=435645.99,672361.09,438186.34,674177.25" \
            --data-urlencode "geometryType=esriGeometryEnvelope" \
            --data-urlencode "inSR=2291" \
            --data-urlencode "outFields=OBJECTID_1" \
            --data-urlencode "returnGeometry=false" \
            --data-urlencode "returnCountOnly=true" \
            --data-urlencode "f=pjson"
          cat /tmp/buildings.json\n          jq -e '.count > 0' /tmp/buildings.json
          grep -qi 'access-control-allow-origin: \*' /tmp/building-headers
          curl -fsS -D /tmp/road-headers -o /tmp/roads.json -G "$ROADS" \
            --data-urlencode "where=1=1" \
            --data-urlencode "geometry=435645.99,672361.09,438186.34,674177.25" \
            --data-urlencode "geometryType=esriGeometryEnvelope" \
            --data-urlencode "inSR=2291" \
            --data-urlencode "outFields=*" \
            --data-urlencode "returnGeometry=false" \
            --data-urlencode "returnCountOnly=true" \
            --data-urlencode "f=pjson"
          jq -e '.count > 0' /tmp/roads.json
          grep -qi 'access-control-allow-origin: \*' /tmp/road-headers

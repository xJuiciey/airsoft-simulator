name: Validate game build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and syntax-check game script
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline game script found")
          Path("/tmp/game.js").write_text(inline[-1])
          PY
          node --check /tmp/game.js
      - name: Verify PEI GIS integrations are present
        run: |
          grep -q "Building_Footprints_2026/MapServer/3/query" index.html
          grep -q "road_centerline/FeatureServer/0/query" index.html
          grep -q "function peiLoadOfficialBuildings" index.html
      - name: Diagnose PEI building GIS query formats
        run: |
          BASE="https://gis.princeedwardisland.ca/server/rest/services/GeoLincData/Building_Footprints_2026/MapServer/3/query"
          curl -fsS -G "$BASE" --data-urlencode "where=1=1" --data-urlencode "outFields=*" --data-urlencode "returnGeometry=true" --data-urlencode "resultRecordCount=5" --data-urlencode "f=json" -o /tmp/simple.json
          echo "Simple query response:"
          cat /tmp/simple.json
          curl -fsS -G "$BASE" --data-urlencode "where=1=1" --data-urlencode "outFields=*" --data-urlencode 'geometry={"xmin":-62.539,"ymin":46.1008,"xmax":-62.506,"ymax":46.117,"spatialReference":{"wkid":4326}}' --data-urlencode "geometryType=esriGeometryEnvelope" --data-urlencode "inSR=4326" --data-urlencode "spatialRel=esriSpatialRelIntersects" --data-urlencode "returnGeometry=true" --data-urlencode "resultRecordCount=5" --data-urlencode "f=geojson" -o /tmp/wgs84.json
          echo "WGS84 envelope response:"
          cat /tmp/wgs84.json
          curl -fsS -G "$BASE" --data-urlencode "where=1=1" --data-urlencode "outFields=*" --data-urlencode 'geometry={"xmin":435645.99,"ymin":672361.09,"xmax":438186.34,"ymax":674177.25,"spatialReference":{"wkid":2291}}' --data-urlencode "geometryType=esriGeometryEnvelope" --data-urlencode "inSR=2291" --data-urlencode "spatialRel=esriSpatialRelIntersects" --data-urlencode "returnGeometry=true" --data-urlencode "resultRecordCount=5" --data-urlencode "f=geojson" -o /tmp/native.json
          echo "Native PEI envelope response:"
          cat /tmp/native.json
          jq -e 'has("error") | not' /tmp/simple.json
          jq -e 'has("error") | not' /tmp/wgs84.json
          jq -e 'has("error") | not' /tmp/native.json
